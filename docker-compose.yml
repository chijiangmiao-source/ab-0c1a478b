services:
  site:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./verify/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  verify:
    build:
      context: ./verify
    environment:
      CODE_DIR: /work
      SITE_URL: http://site
    volumes:
      - ./:/work:ro
    depends_on:
      site:
        condition: service_healthy
